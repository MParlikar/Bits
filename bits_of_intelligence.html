*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#1a1a2e}
.app{min-height:100vh;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;gap:6px;padding:10px 14px;background:#1a1a2e;border-bottom:1px solid #2d2d50;flex-wrap:wrap;position:sticky;top:0;z-index:10}

.cat-label{font-size:11px;letter-spacing:3px;text-transform:uppercase;color:#888;font-weight:600}
.card-wrap{width:100%;max-width:580px;-webkit-perspective:1400px;perspective:1400px}
.card{width:100%;height:540px;position:relative;-webkit-transform-style:preserve-3d;transform-style:preserve-3d;-webkit-transition:-webkit-transform 0.6s ease;transition:transform 0.6s ease;cursor:pointer}
.card.flipped{-webkit-transform:rotateY(180deg);transform:rotateY(180deg)}
.face{position:absolute;top:0;right:0;bottom:0;left:0;height:540px;-webkit-backface-visibility:hidden;backface-visibility:hidden;border-radius:18px;border:1px solid #e0ddd5;overflow:hidden;background:#fff;display:flex;flex-direction:column}
.face-back{-webkit-transform:rotateY(180deg);transform:rotateY(180deg)}
.img-wrap{width:100%;height:420px;flex-shrink:0;background:#111;position:relative;overflow:hidden}
.img-wrap img{position:absolute;top:0;right:0;bottom:0;left:0;width:100%;height:100%;object-fit:cover;object-position:center top;display:block;opacity:0;transition:opacity 0.4s}
.img-wrap img.loaded{opacity:1}
.img-wrap.contain img{object-fit:contain;object-position:center center}
.loading-box{position:absolute;top:0;right:0;bottom:0;left:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:#1a1a2e}
.spinner{width:36px;height:36px;border:3px solid #333;border-top-color:#aaa;border-radius:50%;animation:spin 0.8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-box span{color:#777;font-size:13px}
.err-box{position:absolute;top:0;right:0;bottom:0;left:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:#f5f4f0;padding:24px;text-align:center}
.err-box p{color:#888;font-size:13px;line-height:1.6}
.retry-btn{border:1px solid #bbb;border-radius:8px;padding:8px 20px;font-size:13px;cursor:pointer;background:#fff;color:#555}
.card-footer{padding:12px 20px;border-top:1px solid #f0ede8;background:#fff;flex:1;display:flex;flex-direction:column;justify-content:center}
.card-title{font-size:18px;font-weight:700;color:#1a1a1a;margin-bottom:2px}
.card-sub{font-size:12px;color:#999;font-style:italic}
.tap-hint{font-size:10px;color:#bbb;text-align:right;margin-top:4px}
.back-scroll{padding:20px;overflow-y:auto;flex:1}
.back-scroll h2{font-size:16px;font-weight:700;color:#1a1a1a;margin-bottom:12px;padding-bottom:8px;border-bottom:2px solid #f0ede8}
.iconic-wrap{width:100%;height:150px;background:#111;border-radius:8px;overflow:hidden;margin:10px 0 4px;display:flex;align-items:center;justify-content:center;position:relative}
.iconic-wrap img{width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity 0.4s}
.iconic-wrap img.loaded{opacity:1}
.iconic-caption{font-size:11px;color:#888;font-style:italic;margin-bottom:10px}
.fact-row{display:flex;gap:10px;padding:7px 0;border-bottom:1px solid #f5f5f5;font-size:13px;line-height:1.55;color:#333}
.fact-row:last-child{border-bottom:none}
.fact-n{color:#7F77DD;font-weight:700;min-width:20px;font-size:12px;flex-shrink:0;margin-top:1px}
.controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center}
.ctrl-btn{border:1px solid #ccc;border-radius:10px;padding:10px 24px;font-size:14px;cursor:pointer;background:#fff;color:#333;font-weight:500}
.flip-btn{border:none;border-radius:10px;padding:10px 30px;font-size:14px;cursor:pointer;background:#1a1a2e;color:#fff;font-weight:700}
.speak-btn{border:1px solid #ccc;border-radius:10px;padding:10px 18px;font-size:15px;cursor:pointer;background:#fff}
.prog{font-size:12px;color:#aaa;letter-spacing:1px}
</style>

function wmUrl(fn,w){
  if(fn.slice(0,5)==='data:') return fn;
  return 'https://commons.wikimedia.org/w/index.php?title=Special:FilePath/'+encodeURIComponent(fn)+'&width='+(w||600)+'&_t='+Date.now();
}

function loadImg(wrap,fn,contain,w){
  if(contain) wrap.classList.add('contain');
  wrap.innerHTML='<div class="loading-box"><div class="spinner"></div><span>Loading...</span></div>';
  var img=document.createElement('img');
  var tried=false;
  img.onload=function(){wrap.innerHTML='';img.classList.add('loaded');wrap.appendChild(img);};
  img.onerror=function(){
    if(!tried){tried=true;img.src=wmUrl(fn,w||600);return;}
    var ef=encodeURIComponent(fn);
    wrap.innerHTML='<div class="err-box"><p>Image could not load.<br>Check your connection.</p>'
      +'<button class="retry-btn" onclick="doRetry(this,\''+ef+'\','+(contain?1:0)+','+(w||600)+')">Tap to retry</button></div>';
  };
  img.src=wmUrl(fn,w||600);
}

function doRetry(btn,ef,contain,w){loadImg(btn.parentElement.parentElement,decodeURIComponent(ef),!!contain,w);}

{title:'Elements 11-20',cards:[
  {title:'Sodium',sub:'Na — atomic number 11',img:'Na (Sodium).jpg',
   facts:['A soft silvery metal that you can cut with a knife','Atomic number 11','Reacts so violently with water that it can catch fire','Stored under oil to keep it away from air and water','Its symbol Na comes from the Latin word natrium','Joins with chlorine to make ordinary table salt','Burns with a bright yellow-orange flame','Orange street lamps are lit by glowing sodium','Our nerves use sodium to send messages around the body','Discovered in 1807 by Humphry Davy using electricity']},
  {title:'Magnesium',sub:'Mg — atomic number 12',img:'Magnesium crystals.jpg',
   facts:['A light silvery metal that is surprisingly strong','Atomic number 12','Burns with a dazzling bright white light','Old camera flashes and fireworks used it for that bright flash','So light it is used in racing cars and aeroplanes','Green plants need magnesium to make chlorophyll','The eighth-most common element in the crust of the Earth','Named after Magnesia a region in Greece','Discovered in 1755 by Joseph Black','Mixed with other metals to make strong lightweight alloys']},
  {title:'Aluminium',sub:'Al — atomic number 13',img:'Aluminium-4.jpg',
   facts:['A light silvery metal used almost everywhere','Atomic number 13','The most common metal in the crust of the Earth','Used for drink cans cooking foil and window frames','Light enough to help build aeroplanes and rockets','Does not rust the way iron does','Can be recycled again and again without wearing out','Was once more precious than gold because it was so hard to make','Rubies and sapphires are coloured crystals of aluminium oxide','First made as a pure metal in the 1820s']},
  {title:'Silicon',sub:'Si — atomic number 14',img:'SiliconCroda.jpg',
   facts:['A hard shiny grey solid','Atomic number 14','The second-most common element in the crust of the Earth','Sand and quartz are made mostly of silicon','Used to make the computer chips inside phones and computers','Silicon Valley in California is named after it','Glass is made by melting sand which is full of silicon','A semiconductor so it can control the flow of electricity','Used to make solar panels that turn sunlight into power','Discovered in 1824 by Jons Jacob Berzelius']},
  {title:'Phosphorus',sub:'P — atomic number 15',img:'PhosphComby.jpg',containImg:true,
   facts:['Comes in different forms including white red and violet','Atomic number 15','White phosphorus glows in the dark and can burst into flame','Red phosphorus is used on the side of a matchbox','Its name means light-bringer in Greek','Your bones and teeth are full of phosphorus','The P in DNA stands for phosphorus','Used in fertilisers to help crops grow','So reactive it is never found on its own in nature','Discovered in 1669 by Hennig Brand']},
  {title:'Sulfur',sub:'S — atomic number 16',img:'Sulfur-sample.jpg',
   facts:['A bright lemon-yellow solid','Atomic number 16','Known and used since ancient times','Was called brimstone in old books and stories','Many of its compounds smell like rotten eggs','Often found near volcanoes and hot springs','Used to make matches gunpowder and rubber','Used to make sulfuric acid a very important chemical','Your body needs sulfur to build hair skin and nails','Burns with an eerie blue flame']},
  {title:'Chlorine',sub:'Cl — atomic number 17',img:'Chlorine ampoule.jpg',containImg:true,
   facts:['A yellow-green gas at room temperature','Atomic number 17','Has a strong sharp smell like a swimming pool','One of the most reactive elements of all','Added to pools and drinking water to kill germs','Joins with sodium to make ordinary table salt','Used to make bleach for cleaning and whitening','Named from the Greek word chloros meaning greenish-yellow','Its gas is heavier than the air around us','Discovered in 1774 by Carl Wilhelm Scheele']},
  {title:'Argon',sub:'Ar — atomic number 18',img:'Argon discharge tube.jpg',
   facts:['A noble gas that does not react with anything','Atomic number 18','Makes up almost one percent of the air we breathe','A clear gas with no colour smell or taste','Its name means lazy in Greek because it is so unreactive','Used inside light bulbs to protect the glowing filament','Fills the gap between panes of double-glazed windows','Used to shield metals while they are being welded','The most common noble gas here on Earth','Discovered in 1894 by Lord Rayleigh and William Ramsay']},
  {title:'Potassium',sub:'K — atomic number 19',img:'Potassium.JPG',
   facts:['A soft silvery metal you can cut with a knife','Atomic number 19','Its symbol K comes from the Latin word kalium','Reacts with water so fast that it fizzes and flares up','Stored under oil to keep it safe from air and water','Bananas are famous for being rich in potassium','Your heart and muscles need potassium to work','Used in fertilisers to help plants grow strong','Burns with a beautiful lilac-purple flame','Discovered in 1807 by Humphry Davy']},
  {title:'Calcium',sub:'Ca — atomic number 20',img:'Calcium 1.jpg',
   facts:['A soft silvery-grey metal','Atomic number 20','The most common metal in the human body','Your bones and teeth are made mostly of calcium','Milk and cheese are full of calcium to help you grow','Chalk limestone and marble are all made of calcium','Seashells and eggshells are made of calcium too','The fifth-most common element in the crust of the Earth','Its name comes from calx the Latin word for lime','Discovered in 1808 by Humphry Davy']}
]},
{title:'Herbs',cards:[
  {title:'Basil',sub:'Ocimum basilicum — the king of herbs',img:'Ocimum basilicum 001.JPG',containImg:true,
   facts:['One of the most popular cooking herbs in the world','Has soft bright green leaves with a sweet peppery smell','The name comes from a Greek word meaning royal or kingly','Originally from India and Southeast Asia','It is the main ingredient in Italian pesto sauce','Goes perfectly with tomatoes and mozzarella cheese','A member of the mint family of plants','Grows best in warm sunny weather and hates the cold','There are many kinds including Thai basil and purple basil','Best added at the very end of cooking so it keeps its flavour']},
  {title:'Rosemary',sub:'Salvia rosmarinus — the memory herb',img:'Rosemary Bush (Rosmarinus officinalis) (8346914670).jpg',
   facts:['A woody herb with leaves shaped like little pine needles','Has a strong piney smell that fills the whole kitchen','The name means dew of the sea in Latin','Native to the sunny Mediterranean coast','Grows into a bush that can live for many years','Delicious with roast potatoes lamb and chicken','Has small blue purple or white flowers','Ancient Greek students wore it believing it helped memory','Bees love rosemary flowers and make lovely honey from them','It is an evergreen so you can pick it even in winter']},
  {title:'Thyme',sub:'Thymus vulgaris — tiny but mighty',img:'Thymus.vulgaris.2869.JPG',
   facts:['A low creeping plant with very tiny leaves','Each leaf is only about the size of a grain of rice','Has a warm earthy flavour that is great in soups and stews','Native to southern Europe around the Mediterranean','Ancient Egyptians used thyme when preparing mummies','Ancient Greeks burned it as incense and believed it gave courage','To say someone smelled of thyme was a great compliment in Greece','A member of the mint family like basil and rosemary','Produces pretty pink or purple flowers in early summer','Often used in a bundle of herbs called a bouquet garni']},
  {title:'Sage',sub:'Salvia officinalis — the wise herb',img:'Salvia officinalis p1150380.jpg',
   facts:['Has soft velvety grey-green leaves','The leaves feel a bit fuzzy like a soft blanket','Its Latin name comes from a word meaning to heal or save','Native to the Mediterranean region','Has a strong earthy taste and a little goes a long way','Wonderful with butter and pasta or with roast turkey','Produces beautiful purple blue flowers','Some kinds have purple gold or variegated leaves','An evergreen shrub that comes back every year','Sage and onion stuffing is a classic dish in Britain']},
  {title:'Mint',sub:'Mentha spicata — cool and refreshing',img:'Mentha spicata var. viridis 002.JPG',
   facts:['Famous for its cool refreshing taste','The cooling feeling comes from a chemical called menthol','Spearmint is the most common kind used in cooking','Used in toothpaste chewing gum and sweets','Grows incredibly fast and can take over a whole garden','Gardeners often plant it in a pot to stop it spreading','Great in drinks like mint tea and lemonade','Used in Middle Eastern dishes like tabbouleh salad','Named after Minthe a character in an ancient Greek myth','The mint family also includes basil rosemary sage and thyme']},
  {title:'Parsley',sub:'Petroselinum crispum — more than a garnish',img:'Petroselinum crispum 003.JPG',
   facts:['One of the most widely used herbs in the world','Comes in curly leaf and flat leaf varieties','Flat leaf parsley is also called Italian parsley','Has a fresh clean slightly peppery taste','Packed with vitamin C and vitamin K','Chewing parsley can help freshen your breath','Native to the Mediterranean region','A key ingredient in tabbouleh and in French cooking','The ancient Greeks made victory crowns from parsley','Often used as a garnish but it is delicious to eat too']},
  {title:'Cilantro',sub:'Coriandrum sativum — loved or hated',img:'A scene of Coriander leaves.JPG',containImg:true,
   facts:['The leaves are called cilantro and the seeds are called coriander','Has a bright fresh citrusy taste','Some people think it tastes like soap because of their genes','About one in ten people carry that soapy taste gene','Used all over the world in Mexican Indian and Thai cooking','The whole plant can be eaten — leaves stems seeds and roots','One of the oldest herbs known to people','Seeds were even found in ancient Egyptian tombs','Grows quickly and prefers cooler weather','The seeds taste warm and nutty — completely different from the leaves']},
  {title:'Oregano',sub:'Origanum vulgare — the pizza herb',img:'20140126Origanum vulgare.jpg',
   facts:['Often called the pizza herb because it is sprinkled on top','Has a bold peppery slightly bitter flavour','The name means joy of the mountain in Greek','Grows wild on sunny Mediterranean hillsides','Unusually it tastes even stronger when dried than fresh','A key flavour in Italian Greek and Mexican cooking','Greek oregano is considered the tastiest kind','A member of the mint family and a close cousin of marjoram','Produces small pink or white flowers that bees love','Became popular in America after soldiers tasted it in Italy']},
  {title:'Dill',sub:'Anethum graveolens — feathery and fresh',img:'Anethum graveolens 001.JPG',
   facts:['Has soft feathery leaves that look like green threads','The leaves are sometimes called dill weed','Has a fresh grassy taste with a hint of liquorice','Famous for flavouring pickled cucumbers called dill pickles','Very popular in Scandinavian and Eastern European cooking','Delicious with fish especially salmon','The name may come from an old word meaning to soothe','Both the leaves and the seeds are used in cooking','Produces flat clusters of tiny yellow flowers','Grows tall and thin and can reach up to 60 centimetres']},
  {title:'Bay Leaf',sub:'Laurus nobilis — the crown of victory',img:'Laurus nobilis 001.JPG',
   facts:['Comes from an evergreen tree called the bay laurel','The leaves are thick smooth and dark green','Almost always used dried and whole not chopped up','Added to soups stews and sauces to add deep flavour','The leaf is taken out before serving because it is too tough to eat','Native to the Mediterranean region','Ancient Greeks and Romans made victory crowns from its leaves','Winners of the ancient Olympic Games wore laurel wreaths','The word baccalaureate comes from these laurel crowns','The tree can grow up to 18 metres tall in the wild']}
]}];

function shuffle(a){var b=a.slice();for(var i=b.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=b[i];b[i]=b[j];b[j]=t;}return b;}

function render(){
  var card=CATS[catIdx].cards[order[cardIdx]];
  flipped=false;
  document.getElementById('card').classList.remove('flipped');
  var front=document.getElementById('front');
  var back=document.getElementById('back');
  front.innerHTML='';back.innerHTML='';

  var iw=document.createElement('div');iw.className='img-wrap';front.appendChild(iw);
  loadImg(iw,card.img,!!card.containImg);

  var ft=document.createElement('div');ft.className='card-footer';
  ft.innerHTML='<div class="card-title">'+card.title+'</div>'
    +'<div class="card-sub">'+(card.sub||'')+'</div>'
    +'<div class="tap-hint">Tap to see 10 facts</div>';
  front.appendChild(ft);

  var sc=document.createElement('div');sc.className='back-scroll';
  var bh='<h2>'+card.title+'</h2>';
  if(card.iconic){bh+='<div class="iconic-wrap" id="iw"></div><div class="iconic-caption">'+(card.iconicCaption||'')+'</div>';}
  card.facts.forEach(function(f,i){bh+='<div class="fact-row"><span class="fact-n">'+(i+1)+'</span><span>'+f+'</span></div>';});
  sc.innerHTML=bh;back.appendChild(sc);

  if(card.iconic){var iconWrap=document.getElementById('iw');if(iconWrap)loadImg(iconWrap,card.iconic,false,card.iconicW||400);}
  document.getElementById('prog').textContent='Card '+(cardIdx+1)+' of '+order.length;
}

function flipCard(){flipped=!flipped;document.getElementById('card').classList.toggle('flipped',flipped);}
function next(){cardIdx=(cardIdx+1)%order.length;render();}
function prev(){cardIdx=(cardIdx-1+order.length)%order.length;render();}

function switchCat(i){
  catIdx=i;cardIdx=0;flipped=false;
  order=shuffle(CATS[i].cards.map(function(_,j){return j;}));
  document.querySelectorAll('.cat-btn').forEach(function(b,idx){b.classList.toggle('active',idx===i);});
  document.getElementById('cat-label').textContent=CATS[i].title;
  render();
}

function speak(){
  var card=CATS[catIdx].cards[order[cardIdx]];
  if('speechSynthesis' in window){window.speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(card.title);u.rate=0.88;u.pitch=1.05;window.speechSynthesis.speak(u);}
}

function goFS(){
  var el=document.getElementById('app');
  if(el.requestFullscreen)el.requestFullscreen();
  else if(el.webkitRequestFullscreen)el.webkitRequestFullscreen();
  else if(el.mozRequestFullScreen)el.mozRequestFullScreen();
}

document.addEventListener('keydown',function(e){
  if(e.key==='ArrowRight')next();
  else if(e.key==='ArrowLeft')prev();
  else if(e.key===' '){e.preventDefault();flipCard();}
  else if(e.key==='s'||e.key==='S')speak();
});

switchCat(0);
</script>
</body>
</html>
