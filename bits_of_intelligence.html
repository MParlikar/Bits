<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bits of Intelligence</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#1a1a2e}
.app{min-height:100vh;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;gap:6px;padding:10px 14px;background:#1a1a2e;border-bottom:1px solid #2d2d50;flex-wrap:wrap;position:sticky;top:0;z-index:10}
.topbar-title{font-size:13px;font-weight:700;color:#fff;margin-right:6px;white-space:nowrap;letter-spacing:1px}
.cat-btn{border:1px solid #3d3d60;border-radius:20px;padding:5px 13px;font-size:12px;cursor:pointer;background:transparent;color:#aaa;white-space:nowrap}
.cat-btn.active{background:#fff;color:#1a1a2e;border-color:#fff;font-weight:700}
.fs-btn{border:1px solid #3d3d60;border-radius:6px;padding:5px 12px;font-size:11px;cursor:pointer;background:transparent;color:#aaa;margin-left:auto}
.stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px 16px;gap:14px;background:#f5f4f0}
.cat-label{font-size:11px;letter-spacing:3px;text-transform:uppercase;color:#888;font-weight:600}
.card-wrap{width:100%;max-width:580px;-webkit-perspective:1400px;perspective:1400px}
.card{width:100%;height:540px;position:relative;-webkit-transform-style:preserve-3d;transform-style:preserve-3d;-webkit-transition:-webkit-transform 0.6s ease;transition:transform 0.6s ease;cursor:pointer}
.card.flipped{-webkit-transform:rotateY(180deg);transform:rotateY(180deg)}
.face{position:absolute;top:0;right:0;bottom:0;left:0;height:540px;-webkit-backface-visibility:hidden;backface-visibility:hidden;border-radius:18px;border:1px solid #e0ddd5;overflow:hidden;background:#fff;display:flex;flex-direction:column}
.face-back{-webkit-transform:rotateY(180deg);transform:rotateY(180deg)}
.img-wrap{width:100%;height:420px;flex-shrink:0;background:#111;position:relative;overflow:hidden}
.img-wrap img{position:absolute;top:0;right:0;bottom:0;left:0;width:100%;height:100%;object-fit:cover;object-position:center top;display:block;opacity:0;transition:opacity 0.4s}
.img-wrap img.loaded{opacity:1}
.img-wrap.contain img{object-fit:contain;object-position:center center}
.loading-box{position:absolute;top:0;right:0;bottom:0;left:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:#1a1a2e}
.spinner{width:36px;height:36px;border:3px solid #333;border-top-color:#aaa;border-radius:50%;animation:spin 0.8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-box span{color:#777;font-size:13px}
.err-box{position:absolute;top:0;right:0;bottom:0;left:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:#f5f4f0;padding:24px;text-align:center}
.err-box p{color:#888;font-size:13px;line-height:1.6}
.retry-btn{border:1px solid #bbb;border-radius:8px;padding:8px 20px;font-size:13px;cursor:pointer;background:#fff;color:#555}
.card-footer{padding:12px 20px;border-top:1px solid #f0ede8;background:#fff;flex:1;display:flex;flex-direction:column;justify-content:center}
.card-title{font-size:18px;font-weight:700;color:#1a1a1a;margin-bottom:2px}
.card-sub{font-size:12px;color:#999;font-style:italic}
.tap-hint{font-size:10px;color:#bbb;text-align:right;margin-top:4px}
.back-scroll{padding:20px;overflow-y:auto;flex:1}
.back-scroll h2{font-size:16px;font-weight:700;color:#1a1a1a;margin-bottom:12px;padding-bottom:8px;border-bottom:2px solid #f0ede8}
.iconic-wrap{width:100%;height:150px;background:#111;border-radius:8px;overflow:hidden;margin:10px 0 4px;display:flex;align-items:center;justify-content:center;position:relative}
.iconic-wrap img{width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity 0.4s}
.iconic-wrap img.loaded{opacity:1}
.iconic-caption{font-size:11px;color:#888;font-style:italic;margin-bottom:10px}
.fact-row{display:flex;gap:10px;padding:7px 0;border-bottom:1px solid #f5f5f5;font-size:13px;line-height:1.55;color:#333}
.fact-row:last-child{border-bottom:none}
.fact-n{color:#7F77DD;font-weight:700;min-width:20px;font-size:12px;flex-shrink:0;margin-top:1px}
.controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center}
.ctrl-btn{border:1px solid #ccc;border-radius:10px;padding:10px 24px;font-size:14px;cursor:pointer;background:#fff;color:#333;font-weight:500}
.flip-btn{border:none;border-radius:10px;padding:10px 30px;font-size:14px;cursor:pointer;background:#1a1a2e;color:#fff;font-weight:700}
.speak-btn{border:1px solid #ccc;border-radius:10px;padding:10px 18px;font-size:15px;cursor:pointer;background:#fff}
.prog{font-size:12px;color:#aaa;letter-spacing:1px}
</style>
</head>
<body>
<div class="app" id="app">
  <div class="topbar">
    <span class="topbar-title">BITS OF INTELLIGENCE</span>
    <button class="cat-btn active" onclick="switchCat(0)">World Cup</button>
    <button class="cat-btn" onclick="switchCat(1)">Thailand</button>
    <button class="cat-btn" onclick="switchCat(2)">Nasdaq</button>
    <button class="cat-btn" onclick="switchCat(3)">Mudras</button>
    <button class="cat-btn" onclick="switchCat(4)">Elements</button>
    <button class="cat-btn" onclick="switchCat(5)">Jasmine</button>
    <button class="fs-btn" onclick="goFS()">Full screen</button>
  </div>
  <div class="stage">
    <div class="cat-label" id="cat-label">World Cup 2026</div>
    <div class="card-wrap">
      <div class="card" id="card" onclick="flipCard()">
        <div class="face" id="front"></div>
        <div class="face face-back" id="back"></div>
      </div>
    </div>
    <div class="controls">
      <button class="ctrl-btn" onclick="prev()">&#8592; Prev</button>
      <button class="speak-btn" onclick="speak()">&#128266;</button>
      <button class="flip-btn" onclick="flipCard()">Flip card</button>
      <button class="ctrl-btn" onclick="next()">Next &#8594;</button>
    </div>
    <div class="prog" id="prog"></div>
  </div>
</div>
<script>
var catIdx=0,cardIdx=0,flipped=false,order=[];

function wmUrl(fn,w){
  if(fn.slice(0,5)==='data:') return fn;
  return 'https://commons.wikimedia.org/w/index.php?title=Special:FilePath/'+encodeURIComponent(fn)+'&width='+(w||600)+'&_t='+Date.now();
}

function loadImg(wrap,fn,contain,w){
  if(contain) wrap.classList.add('contain');
  wrap.innerHTML='<div class="loading-box"><div class="spinner"></div><span>Loading...</span></div>';
  var img=document.createElement('img');
  var tried=false;
  img.onload=function(){wrap.innerHTML='';img.classList.add('loaded');wrap.appendChild(img);};
  img.onerror=function(){
    if(!tried){tried=true;img.src=wmUrl(fn,w||600);return;}
    var ef=encodeURIComponent(fn);
    wrap.innerHTML='<div class="err-box"><p>Image could not load.<br>Check your connection.</p>'
      +'<button class="retry-btn" onclick="doRetry(this,\''+ef+'\','+(contain?1:0)+','+(w||600)+')">Tap to retry</button></div>';
  };
  img.src=wmUrl(fn,w||600);
}

function doRetry(btn,ef,contain,w){loadImg(btn.parentElement.parentElement,decodeURIComponent(ef),!!contain,w);}

   facts:['Brazil are the most successful team in World Cup history with five titles','They were knocked out in the round of 16 by Norway','Erling Haaland scored a famous goal to beat them','Brazil won the World Cup in 1958 1962 1970 1994 and 2002','They are managed by Carlo Ancelotti the Italian coach','The Selecao play in their famous yellow and blue kit','Brazil are the only team to have played in every single World Cup','Christ the Redeemer in Rio de Janeiro is one of the New Seven Wonders','The country has produced legends like Pele Ronaldo and Ronaldinho','Brazilian football is known for its flair skill and samba style']},

{title:'Facts About Thailand',cards:[
  {title:'The Grand Palace',sub:'Bangkok — built 1782',img:'Bangkok Grand Palace.JPG',
   facts:['A grand royal palace in the heart of Bangkok','Was home to the King of Thailand for over 150 years','Built in 1782 by King Rama I','The palace grounds cover about 218000 square metres','Inside the walls is the famous Wat Phra Kaew temple','Wat Phra Kaew holds the sacred Emerald Buddha','The buildings are covered in gold and colourful tiles','The palace has many grand halls and throne rooms','It is one of the most visited landmarks in Thailand','Guards in white uniforms stand at the gates']},
  {title:'Wat Arun',sub:'Bangkok — the Temple of Dawn',img:'Wat Arun and Sunset.jpg',
   facts:['A stunning temple on the bank of the Chao Phraya River','Known as the Temple of Dawn','Famous for its tall central tower covered in colourful tiles','The tower stands about 82 metres tall','Decorated with tiny pieces of Chinese porcelain and seashells','Named after Aruna the Hindu god of the dawn','One of the most photographed temples in all of Thailand','Looks especially beautiful at sunset','Was built during the time of the Ayutthaya Kingdom','Visitors can climb partway up the steep steps of the tower']},
  {title:'Thai Elephants',sub:'Thailands national symbol',img:'Asian Elephant in Thailand.jpg',containImg:true,
   facts:['The elephant is Thailands national animal and a symbol of strength','Thailand is home to the Asian elephant','In the past elephants helped carry logs and build cities','White elephants were so rare they belonged only to the king','The Thai word for white elephant is chang phueak','The national flag once featured a white elephant','Today elephants are protected and cared for in sanctuaries','They are incredibly smart and can use tools','Elephants play a role in many Thai festivals and parades','Thailand has about 3000 to 4000 elephants today']},
  {title:'Floating Market',sub:'Damnoen Saduak — Ratchaburi',img:'Damnoen Saduak floating market.jpg',
   facts:['A market where sellers trade from small wooden boats','The most famous one is at Damnoen Saduak near Bangkok','Sellers wear wide straw hats and paddle along canals','They sell fresh fruits vegetables and cooked food from their boats','The canals are called khlongs in Thai','Floating markets have existed in Thailand for centuries','Before roads were built most travel was by water','Buyers can sit in a boat and shop as they float along','The markets are busiest early in the morning','Colourful boats packed with tropical fruit make a beautiful sight']},
  {title:'Pad Thai',sub:'Thailands famous noodle dish',img:'Phat thai - Bangkok - 2017-06-16 (001).jpg',
   facts:['Thailands most famous stir-fried noodle dish','Made with flat rice noodles eggs tofu and bean sprouts','Flavoured with tamarind paste fish sauce and lime juice','Often topped with crushed peanuts and fresh lime','Street vendors cook it in a hot wok over open flames','The dish became popular in the 1930s and 1940s','The Thai government promoted it as a national dish','A plate of pad thai costs very little from a street cart','It can be made with shrimp chicken or just vegetables','You will find it on almost every street corner in Thailand']},
  {title:'Muay Thai',sub:'The art of eight limbs',img:'Muay Thai high kick.jpg',
   facts:['The national sport and martial art of Thailand','Known as the art of eight limbs','Fighters use fists elbows knees and shins','That makes eight points of contact for striking','Has been practised in Thailand for hundreds of years','Fighters wear special armbands called pra jiad','Before each fight they perform a dance called the wai kru','The two main stadiums are Lumpinee and Rajadamnern in Bangkok','It became an Olympic sport at the 2024 Summer Games','Children in Thailand often begin training at a very young age']},
  {title:'Loy Krathong',sub:'Festival of lights on the water',img:'Loy Krathong Bangkok Lumpini Park 1.jpg',
   facts:['A beautiful Thai festival held on the night of the full moon in November','The name means to float a basket','People make small floating baskets called krathongs','Krathongs are made from banana leaves flowers and candles','They are set gently onto rivers lakes and canals','The flickering candles floating on the water look magical','People make a wish as they release their krathong','The festival thanks the water goddess Mae Khongkha','In northern Thailand sky lanterns are also released','It is one of the most beautiful festivals in the world']},
  {title:'The Tuk-Tuk',sub:'Thailands three-wheeled taxi',img:'Bangkok Tuk Tuk Thailand 02-2003.jpg',
   facts:['A small three-wheeled motorized taxi found all over Thailand','Named after the tuk-tuk-tuk sound of its engine','Open on the sides so passengers can feel the breeze','Usually brightly painted in green red or blue','A fun and exciting way to travel through busy streets','Drivers can zip through traffic faster than cars','You should always agree on the price before getting in','They are a symbol of Bangkok and Thai city life','Originally based on the Japanese auto rickshaw design','Tourists love riding them for the experience']},
  {title:'Songkran',sub:'Thai New Year water festival — April',img:'Chiang-Mai Thailand Songkran-Festival-2017-07.jpg',
   facts:['The traditional Thai New Year celebrated every April','Falls on April 13 to 15 each year','Famous for huge water fights in the streets','People splash water on each other for fun and good luck','Water symbolises washing away bad luck from the old year','Families visit temples and pour water over Buddha statues','Young people pour scented water on the hands of their elders','Chiang Mai and Bangkok have the biggest celebrations','The festival was recognised by UNESCO in 2023','One of the most fun festivals in the whole world']},
  {title:'Thai Longtail Boat',sub:'Traditional wooden boat',img:'Longtail Boat At Maya Bay, Krabi, Thailand.jpg',
   facts:['A traditional wooden boat found all over Thailand','Named for the long propeller shaft that sticks out the back','The engine sits in the middle of the boat','A single long metal pole reaches from the engine into the water','The driver steers by swinging the propeller left and right','Used by fishermen and for carrying passengers to islands','Common around Krabi Phi Phi and other Thai beaches','The boats are often painted in bright colours','Many have colourful ribbons and flower garlands for good luck','A longtail ride to a Thai island is an unforgettable experience']}
]},
{title:'Top Nasdaq Companies',cards:[
  {title:'Nvidia',sub:'NVDA — Santa Clara, CA',img:'Nvidia HQ.jpg',
   facts:['An American technology company in Santa Clara California','Founded in 1993 by Jensen Huang and two friends','Makes graphics chips called GPUs','GPUs draw the pictures on computer and game screens','Now their chips also power artificial intelligence','Became the worlds most valuable company in 2025','Trades on Nasdaq under the symbol NVDA','The two main buildings are called Voyager and Endeavor','The buildings are full of triangle shapes','Founder Jensen Huang always wears a black leather jacket']},
  {title:'Apple',sub:'AAPL — Cupertino, CA',img:'Apple park cupertino 2019.jpg',
   facts:['An American technology company in Cupertino California','Makes the iPhone iPad Mac and Apple Watch','Founded in a garage in California in 1976','Founded by Steve Jobs Steve Wozniak and Ronald Wayne','Headquarters is called Apple Park','Apple Park is shaped like a giant ring and nicknamed the spaceship','Houses more than 12000 employees on a huge campus','Trades on Nasdaq under the symbol AAPL','One of the most valuable companies in the world','Famous logo is an apple with a bite taken out']},
  {title:'Alphabet (Google)',sub:'GOOGL — Mountain View, CA',img:'Googleplex-Patio-Aug-2014.JPG',
   facts:['The parent company of Google YouTube and Android','Headquartered in Mountain View California','The headquarters is called the Googleplex','Google was founded by Larry Page and Sergey Brin in 1998','It started as a school project at Stanford University','Google handles over 8 billion searches every day','Owns YouTube the worlds biggest video website','Also owns Android the most used phone software','Trades on Nasdaq under the symbol GOOGL','The name Google comes from googol — a 1 with 100 zeros']},
  {title:'Microsoft',sub:'MSFT — Redmond, WA',img:'Building 92 of Microsoft Redmond Campus - panoramio.jpg',
   facts:['An American technology company in Redmond Washington','Founded by Bill Gates and Paul Allen in 1975','Makes Windows the worlds most used computer software','Also makes the Xbox video game console','Makes Microsoft Office Word Excel and PowerPoint','Owns Minecraft the best-selling video game of all time','Trades on Nasdaq under the symbol MSFT','Has over 200000 employees worldwide','Partnered with OpenAI the makers of ChatGPT','The campus in Redmond has more than 80 buildings']},
  {title:'Amazon',sub:'AMZN — Seattle, WA',img:'Amazon Spheres from 6th Avenue, April 2020.jpg',
   facts:['Started as an online bookstore in 1994','Founded by Jeff Bezos in his garage in Seattle','Now sells almost everything you can imagine','Headquartered in Seattle Washington','The Amazon Spheres are three giant glass plant-filled domes','The Spheres are home to 40000 plants from rainforests','Owns Amazon Prime Whole Foods Twitch and IMDb','Also runs Amazon Web Services for cloud computing','Trades on Nasdaq under the symbol AMZN','Named after the Amazon river — the biggest river in the world']},
  {title:'Meta',sub:'META — Menlo Park, CA',img:'Meta Headquarters Sign.jpg',
   facts:['The company that owns Facebook Instagram and WhatsApp','Was called Facebook Inc. until 2021','Renamed Meta because of the metaverse — a virtual world','Founded by Mark Zuckerberg in 2004','He started it in his Harvard college dorm room','Headquartered in Menlo Park California','The address is 1 Hacker Way','Trades on Nasdaq under the symbol META','Facebook has over 3 billion users worldwide','Also makes the Quest virtual reality headset']},
  {title:'Broadcom',sub:'AVGO — Palo Alto, CA',img:'Broadcom Inc.jpg',
   facts:['A semiconductor company that makes computer chips','Headquartered in Palo Alto California','Trades on Nasdaq under the symbol AVGO','Chips are inside iPhones Wi-Fi routers and cars','Makes Wi-Fi and Bluetooth chips used in many devices','Started in 1961 inside Hewlett-Packard','The current company formed after a 2016 merger with Avago','One of the largest semiconductor companies in the world','Surpassed 2 trillion dollars in value in 2026','Run by CEO Hock Tan since 2006']},
  {title:'Tesla',sub:'TSLA — Austin, TX',img:'Tesla Model 3 Front View.jpg',
   facts:['An American electric car company','Founded in 2003 and led by Elon Musk','Makes electric cars that run on batteries instead of gasoline','Famous cars include the Model S Model 3 Model X and Model Y','Also makes the futuristic Cybertruck','Cars can drive themselves using Autopilot software','Headquartered in Austin Texas','Trades on Nasdaq under the symbol TSLA','Named after the inventor Nikola Tesla','Also makes solar panels and home batteries']},
  {title:'Costco',sub:'COST — Issaquah, WA',img:'Costco Wholesale Club.jpg',
   facts:['A big warehouse-style shopping club','Members pay a yearly fee to shop there','Sells food clothing toys and almost everything in huge sizes','Famous for selling a whole rotisserie chicken for $4.99','Famous for the $1.50 hot dog and soda combo since 1985','Headquartered in Issaquah Washington near Seattle','Has over 900 warehouses around the world','Trades on Nasdaq under the symbol COST','The first store opened in 1983 in Seattle','One of the worlds largest retailers']},
  {title:'Netflix',sub:'NFLX — Los Gatos, CA',img:'Netflix headquarters.jpg',
   facts:['A streaming service for movies and TV shows','Started in 1997 as a DVD rental by mail company','Began streaming videos online in 2007','Headquartered in Los Gatos California','Has hundreds of millions of subscribers worldwide','Trades on Nasdaq under the symbol NFLX','Makes its own shows called Netflix Originals','Famous shows include Stranger Things and Wednesday','Available in over 190 countries','Founded by Reed Hastings and Marc Randolph']}
]},

function shuffle(a){var b=a.slice();for(var i=b.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=b[i];b[i]=b[j];b[j]=t;}return b;}

function render(){
  var card=CATS[catIdx].cards[order[cardIdx]];
  flipped=false;
  document.getElementById('card').classList.remove('flipped');
  var front=document.getElementById('front');
  var back=document.getElementById('back');
  front.innerHTML='';back.innerHTML='';

  var iw=document.createElement('div');iw.className='img-wrap';front.appendChild(iw);
  loadImg(iw,card.img,!!card.containImg);

  var ft=document.createElement('div');ft.className='card-footer';
  ft.innerHTML='<div class="card-title">'+card.title+'</div>'
    +'<div class="card-sub">'+(card.sub||'')+'</div>'
    +'<div class="tap-hint">Tap to see 10 facts</div>';
  front.appendChild(ft);

  var sc=document.createElement('div');sc.className='back-scroll';
  var bh='<h2>'+card.title+'</h2>';
  if(card.iconic){bh+='<div class="iconic-wrap" id="iw"></div><div class="iconic-caption">'+(card.iconicCaption||'')+'</div>';}
  card.facts.forEach(function(f,i){bh+='<div class="fact-row"><span class="fact-n">'+(i+1)+'</span><span>'+f+'</span></div>';});
  sc.innerHTML=bh;back.appendChild(sc);

  if(card.iconic){var iconWrap=document.getElementById('iw');if(iconWrap)loadImg(iconWrap,card.iconic,false,card.iconicW||400);}
  document.getElementById('prog').textContent='Card '+(cardIdx+1)+' of '+order.length;
}

function flipCard(){flipped=!flipped;document.getElementById('card').classList.toggle('flipped',flipped);}
function next(){cardIdx=(cardIdx+1)%order.length;render();}
function prev(){cardIdx=(cardIdx-1+order.length)%order.length;render();}

function switchCat(i){
  catIdx=i;cardIdx=0;flipped=false;
  order=shuffle(CATS[i].cards.map(function(_,j){return j;}));
  document.querySelectorAll('.cat-btn').forEach(function(b,idx){b.classList.toggle('active',idx===i);});
  document.getElementById('cat-label').textContent=CATS[i].title;
  render();
}

function speak(){
  var card=CATS[catIdx].cards[order[cardIdx]];
  if('speechSynthesis' in window){window.speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(card.title);u.rate=0.88;u.pitch=1.05;window.speechSynthesis.speak(u);}
}

function goFS(){
  var el=document.getElementById('app');
  if(el.requestFullscreen)el.requestFullscreen();
  else if(el.webkitRequestFullscreen)el.webkitRequestFullscreen();
  else if(el.mozRequestFullScreen)el.mozRequestFullScreen();
}

document.addEventListener('keydown',function(e){
  if(e.key==='ArrowRight')next();
  else if(e.key==='ArrowLeft')prev();
  else if(e.key===' '){e.preventDefault();flipCard();}
  else if(e.key==='s'||e.key==='S')speak();
});

switchCat(0);
</script>
